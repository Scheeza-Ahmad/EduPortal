name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (${{ matrix.app }})
        run: npm run lint --workspace=${{ matrix.app }} --if-present

      - name: Type-check (${{ matrix.app }})
        run: npm run typecheck --workspace=${{ matrix.app }} --if-present
